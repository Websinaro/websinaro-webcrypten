name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest flask fastapi uvicorn django httpx mypy ruff

      - name: Lint (syntax check)
        run: |
          ruff check websinaro/ --select=E9,F

      - name: Verify package imports correctly
        env:
          MASTER_KEY: "Xk9pQ2vN8mL4wR7tY1zA6bC3dF5gH0jK+/=="
        run: |
          python -c "from websinaro.webcrypten import webcryptpen; t = webcryptpen.encrypt('ci-smoke-test'); assert webcryptpen.decrypt(t) == b'ci-smoke-test'; print('Import + round-trip OK')"

      - name: Run tests
        env:
          MASTER_KEY: "Xk9pQ2vN8mL4wR7tY1zA6bC3dF5gH0jK+/=="
        run: |
          pytest tests/ -v

      - name: Run type checks
        run: |
          mypy -p websinaro.webcrypten
